<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' http://127.0.0.1:8080; img-src 'self' data: blob: http://127.0.0.1:8080; media-src 'self' data: blob: http://127.0.0.1:8080; script-src 'self'; style-src 'self' 'unsafe-inline';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MagicFloor Dynamic Player</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="displayRoot" class="display-root is-archive-view">
      <section id="archiveView" class="archive-view" aria-label="iPad 作品檔案同步畫面">
        <div id="archiveMirrorFallback" class="archive-mirror-fallback" aria-hidden="false">
          <img id="archiveSourceImage" class="archive-source-image" alt="" draggable="false" />
        </div>
        <img id="archiveMirrorImage" class="archive-mirror-image" alt="" draggable="false" />
        <canvas id="archivePortalCanvas" class="archive-portal-canvas" aria-hidden="true"></canvas>
        <canvas id="archivePortalFallbackCanvas" class="archive-portal-canvas archive-portal-fallback-canvas" aria-hidden="true"></canvas>
      </section>

      <section id="stageStandby" class="stage-standby" aria-label="MagicFloor 舞台待機畫面" aria-hidden="true">
        <img class="stage-standby-logo" src="./assets/Right_Logo.png" alt="MagicFloor" draggable="false" />
      </section>

      <canvas id="backgroundStage" class="stage-canvas background-stage" width="1920" height="1080" aria-hidden="true"></canvas>
      <canvas id="stage" width="1920" height="1080"></canvas>
      <section id="statusPanel" class="status-panel">
        <div class="brand">MagicFloor Dynamic Player</div>
        <div id="statusText" class="status-text">正在啟動 8080 接收服務...</div>
        <div id="groupText" class="group-text">等待 iPad 載入作品檔案</div>
      </section>
    </div>
    <script type="module" src="./player.js"></script>
  </body>
</html>
